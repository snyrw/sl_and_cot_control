[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cotsl"
version = "0.1.0"
description = "CoT controllability x subliminal learning"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tinker>=0.40.0",
    "tinker-cookbook>=0.7.1",
    # tinker-cookbook excludes these transformers releases (tokenizer bugs); mirror it.
    "transformers>=4.57.6,!=5.3.0,!=5.4.*,!=5.5.0,!=5.5.1,!=5.5.2,!=5.5.3,!=5.6.*",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "datasets>=2.14",
    "openai>=1.50",
    "aiohttp>=3.9",
    "tqdm>=4.66",
    # ReasonIF instruction checkers
    "fast-langdetect>=0.3",
    "immutabledict>=4.0",
    "nltk>=3.9.1",
    "langdetect>=1.0.9",
    "wandb>=0.17",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

# Tinker runs remotely; a CPU torch build is all the client needs.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/cotsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["network: needs API keys / network (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
